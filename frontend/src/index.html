<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Conciliador de facturas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before Angular boots, so the page never flashes the wrong one.
    try {
      var theme = localStorage.getItem('conciliador-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
